services:
  agent-report:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fireguard-agent-report
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"   # localhost only, matching the other repos' convention
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fireguard-net
    # joined so /health/all (Step 3) can reach agent-compliance by
    # service name, and so a future API Gateway can reach this service
    # the same way

networks:
  fireguard-net:
    external: true
    # same network fireguard-vector-store's docker-compose.yml creates.
    # If your fireguard-vector-store folder isn't named exactly that,
    # check `docker network ls` and update this to match.
    name: fireguard-vector-store_fireguard-net
